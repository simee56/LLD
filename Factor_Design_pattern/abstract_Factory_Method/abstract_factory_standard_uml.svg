<svg width="1500" height="900" viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="1500" height="900" fill="black"/>
<style>text { font-family: "Comic Neue","Segoe Print","Bradley Hand","Comic Sans MS",cursive,sans-serif; fill: white; }</style>
<text x="40" y="880" font-size="15" text-anchor="start" fill="white" opacity="0.5" font-style="italic">Abstract Factory Pattern -- Standard UML Class Diagram</text>

<!-- Inheritance: ConcreteProductA1 / A2 -> AbstractProductA -->
<path d="M230,280 Q255,235 278,192" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M270.9,191.0 L288.1,193.3 L282.0,176.3 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

