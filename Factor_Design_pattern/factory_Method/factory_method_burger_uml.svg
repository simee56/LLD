<text x="560" y="597" font-size="14" text-anchor="start" fill="white" opacity="0.9">&#160;&#160;&#160;&#160;: Burger* = 0</text>
<text x="560" y="618" font-size="13" text-anchor="start" fill="white" opacity="0.6" font-style="italic">Creator / factory method</text>
