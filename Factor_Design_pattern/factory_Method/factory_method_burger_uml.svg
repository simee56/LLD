<!-- BurgerFactory (abstract creator) -->
<g>
<path d="M540,480 L860,480 L860,630 L540,630 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M541.5,481.5 L861.5,481 L861,631 L539,630.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
