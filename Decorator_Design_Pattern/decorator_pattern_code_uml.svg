<svg width="1650" height="980" viewBox="0 0 1650 980" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="1650" height="980" fill="black"/>
<style>text { font-family: "Comic Neue","Segoe Print","Bradley Hand","Comic Sans MS",cursive,sans-serif; fill: white; }</style>
<text x="40" y="960" font-size="15" text-anchor="start" fill="white" opacity="0.5" font-style="italic">Ninja Power-Up Example (from code) - UML Class Diagram (Decorator Pattern)</text>

<!-- Realization: Ninja implements Character -->
<path d="M300,400 Q540,300 745,214" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="7,5"/>
<path d="M734,225 L752,213 L743,231 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Realization: CharacterDecorator implements Character -->
<path d="M890,400 L890,212" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="7,5"/>
<path d="M881.5,213 L890,196 L898.5,213 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Composition: CharacterDecorator has a Character (wrapped instance) -->
<path d="M1000,400 L1000,210" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M1000,400 L986,388 L1000,376 L1014,388 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>
<text x="1015" y="330" font-size="12" text-anchor="start" fill="white" opacity="0.85">character</text>
<text x="1015" y="348" font-size="12" text-anchor="start" fill="white" opacity="0.85">1</text>

<!-- Inheritance: HeightUp extends CharacterDecorator -->
<path d="M620,730 Q640,670 660,612" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M652,606 L671,600 L661,617 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Inheritance: GunPowerUp extends CharacterDecorator -->
<path d="M970,730 L970,612" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M961.5,611 L970,594 L978.5,611 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Inheritance: StarPowerUp extends CharacterDecorator -->
<path d="M1320,730 Q1230,670 1145,612" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M1139,628 L1136,609 L1153,619 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Character (interface) -->
<g>
<path d="M680,50 L1080,50 L1080,212 L680,212 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M681.5,51.5 L1081.5,51 L1081,213 L679,212.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="880" y="74" font-size="13" text-anchor="middle" fill="white" opacity="0.75" font-style="italic">&#171;interface&#187;</text>
<text x="880" y="100" font-size="20" text-anchor="middle" fill="white">Character</text>
<path d="M692,118 Q880,116 1068,119" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="700" y="142" font-size="14" text-anchor="start" fill="white" opacity="0.9">+ getAbilities() : string = 0</text>
<text x="700" y="164" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">common interface for Ninja</text>
<text x="700" y="182" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">and all power-up decorators</text>
</g>

<!-- Ninja (concrete component) -->
<g>
<path d="M140,400 L460,400 L460,560 L140,560 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M141.5,401.5 L461.5,401 L461,561 L139,560.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="300" y="432" font-size="18" text-anchor="middle" fill="white">Ninja</text>
<path d="M152,452 Q300,450 448,453" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="160" y="478" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ getAbilities() : string</text>
<text x="160" y="500" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">returns "Ninja"</text>
<text x="160" y="518" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">basic, un-decorated character</text>
</g>

<!-- CharacterDecorator (abstract) -->
<g>
<path d="M600,400 L1180,400 L1180,610 L600,610 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M601.5,401.5 L1181.5,401 L1181,611 L599,610.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="890" y="424" font-size="13" text-anchor="middle" fill="white" opacity="0.75" font-style="italic">&#171;abstract&#187;</text>
<text x="890" y="450" font-size="20" text-anchor="middle" fill="white">CharacterDecorator</text>
<path d="M612,468 Q890,466 1168,469" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="620" y="492" font-size="14" text-anchor="start" fill="white" opacity="0.9"># character : Character*</text>
<text x="620" y="516" font-size="14" text-anchor="start" fill="white" opacity="0.9">+ CharacterDecorator(Character*)</text>
<text x="620" y="540" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">does not override getAbilities();</text>
<text x="620" y="560" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">each concrete decorator provides</text>
<text x="620" y="580" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">its own implementation</text>
</g>

<!-- HeightUp -->
<g>
<path d="M480,730 L780,730 L780,900 L480,900 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M481.5,731.5 L781.5,731 L781,901 L479,900.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="630" y="762" font-size="18" text-anchor="middle" fill="white">HeightUp</text>
<path d="M492,782 Q630,780 768,783" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="500" y="808" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ getAbilities() : string</text>
<text x="500" y="830" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">appends " with HeightUp"</text>
<text x="500" y="850" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">to character-&gt;getAbilities()</text>
</g>

<!-- GunPowerUp -->
<g>
<path d="M830,730 L1130,730 L1130,900 L830,900 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M831.5,731.5 L1131.5,731 L1131,901 L829,900.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="980" y="762" font-size="18" text-anchor="middle" fill="white">GunPowerUp</text>
<path d="M842,782 Q980,780 1118,783" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="850" y="808" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ getAbilities() : string</text>
<text x="850" y="830" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">appends " with Gun"</text>
<text x="850" y="850" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">to character-&gt;getAbilities()</text>
</g>

<!-- StarPowerUp -->
<g>
<path d="M1180,730 L1480,730 L1480,900 L1180,900 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M1181.5,731.5 L1481.5,731 L1481,901 L1179,900.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="1330" y="762" font-size="18" text-anchor="middle" fill="white">StarPowerUp</text>
<path d="M1192,782 Q1330,780 1468,783" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="1200" y="808" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ getAbilities() : string</text>
<text x="1200" y="830" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ ~StarPowerUp()</text>
<text x="1200" y="850" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">appends " with Star Power</text>
<text x="1200" y="868" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">(Limited Time)"; logs on destroy</text>
</g>

</svg>
