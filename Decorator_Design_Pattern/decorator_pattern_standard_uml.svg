<svg width="1450" height="980" viewBox="0 0 1450 980" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="1450" height="980" fill="black"/>
<style>text { font-family: "Comic Neue","Segoe Print","Bradley Hand","Comic Sans MS",cursive,sans-serif; fill: white; }</style>
<text x="40" y="960" font-size="15" text-anchor="start" fill="white" opacity="0.5" font-style="italic">Decorator Design Pattern (generic / GoF) - UML Class Diagram</text>

<!-- Realization: ConcreteComponent implements Component -->
<path d="M300,400 Q450,300 640,214" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="7,5"/>
<path d="M629,225 L647,213 L638,231 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Realization: Decorator implements Component -->
<path d="M870,400 Q865,305 858,214" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="7,5"/>
<path d="M849,215 L858,198 L866.5,215 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Composition: Decorator has a Component (wrapped instance) -->
<path d="M950,400 L950,210" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M950,400 L936,388 L950,376 L964,388 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>
<text x="965" y="330" font-size="12" text-anchor="start" fill="white" opacity="0.85">component</text>
<text x="965" y="348" font-size="12" text-anchor="start" fill="white" opacity="0.85">1</text>

<!-- Inheritance: ConcreteDecoratorA extends Decorator -->
<path d="M750,730 L750,612" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M741.5,611 L750,594 L758.5,611 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Inheritance: ConcreteDecoratorB extends Decorator -->
<path d="M1110,730 L1110,612" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M1101.5,611 L1110,594 L1118.5,611 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Component (interface) -->
<g>
<path d="M600,50 L980,50 L980,212 L600,212 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M601.5,51.5 L981.5,51 L981,213 L599,212.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="790" y="74" font-size="13" text-anchor="middle" fill="white" opacity="0.75" font-style="italic">&#171;interface&#187;</text>
<text x="790" y="100" font-size="20" text-anchor="middle" fill="white">Component</text>
<path d="M612,118 Q790,116 968,119" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="620" y="142" font-size="14" text-anchor="start" fill="white" opacity="0.9">+ operation() = 0</text>
<text x="620" y="164" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">common interface for both</text>
<text x="620" y="182" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">plain objects and decorators</text>
</g>

<!-- ConcreteComponent -->
<g>
<path d="M140,400 L460,400 L460,560 L140,560 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M141.5,401.5 L461.5,401 L461,561 L139,560.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="300" y="432" font-size="18" text-anchor="middle" fill="white">ConcreteComponent</text>
<path d="M152,452 Q300,450 448,453" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="160" y="478" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ operation()</text>
<text x="160" y="500" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">core object being</text>
<text x="160" y="518" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">decorated</text>
</g>

<!-- Decorator (abstract) -->
<g>
<path d="M680,400 L1180,400 L1180,610 L680,610 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M681.5,401.5 L1181.5,401 L1181,611 L679,610.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="930" y="424" font-size="13" text-anchor="middle" fill="white" opacity="0.75" font-style="italic">&#171;abstract&#187;</text>
<text x="930" y="450" font-size="20" text-anchor="middle" fill="white">Decorator</text>
<path d="M692,468 Q930,466 1168,469" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="700" y="492" font-size="14" text-anchor="start" fill="white" opacity="0.9"># component : Component*</text>
<text x="700" y="516" font-size="14" text-anchor="start" fill="white" opacity="0.9">+ Decorator(Component*)</text>
<text x="700" y="540" font-size="14" text-anchor="start" fill="white" opacity="0.9">+ operation()</text>
<text x="700" y="560" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">delegates to component-&gt;operation()</text>
<text x="700" y="580" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">wraps another Component; "is-a" and "has-a"</text>
</g>

<!-- ConcreteDecoratorA -->
<g>
<path d="M600,730 L900,730 L900,910 L600,910 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M601.5,731.5 L901.5,731 L901,911 L599,910.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="750" y="762" font-size="18" text-anchor="middle" fill="white">ConcreteDecoratorA</text>
<path d="M612,782 Q750,780 888,783" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="620" y="808" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ operation()</text>
<text x="620" y="830" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ addedBehavior()</text>
<text x="620" y="852" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">extends result before/after</text>
<text x="620" y="870" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">calling component-&gt;operation()</text>
</g>

<!-- ConcreteDecoratorB -->
<g>
<path d="M960,730 L1260,730 L1260,910 L960,910 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M961.5,731.5 L1261.5,731 L1261,911 L959,910.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="1110" y="762" font-size="18" text-anchor="middle" fill="white">ConcreteDecoratorB</text>
<path d="M972,782 Q1110,780 1248,783" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="980" y="808" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ operation()</text>
<text x="980" y="830" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ extraState</text>
<text x="980" y="852" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">adds state and/or behavior</text>
<text x="980" y="870" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">around the wrapped object</text>
</g>

</svg>
