<svg width="1450" height="820" viewBox="0 0 1450 820" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="1450" height="820" fill="black"/>
<style>text { font-family: "Comic Neue","Segoe Print","Bradley Hand","Comic Sans MS",cursive,sans-serif; fill: white; }</style>
<text x="40" y="800" font-size="15" text-anchor="start" fill="white" opacity="0.5" font-style="italic">YouTube Channel Example (from code) -- UML Class Diagram (Observer Pattern)</text>

<!-- Realization: Channel ..|> IChannel -->
<path d="M365,460 Q365,355 365,258" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="7,5"/>
<path d="M356.5,257 L365,240 L373.5,257 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Realization: Subscriber ..|> ISubscriber -->
<path d="M1110,460 Q1110,345 1110,232" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-dasharray="7,5"/>
<path d="M1101.5,231 L1110,214 L1118.5,231 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>

<!-- Aggregation: Channel o-- ISubscriber (vector<ISubscriber*> subscribers) -->
<path d="M580,140 L900,140" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M580,140 L598,130 L616,140 L598,150 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>
<text x="650" y="128" font-size="13" text-anchor="start" fill="white" opacity="0.85">subscribers</text>
<text x="866" y="128" font-size="13" text-anchor="middle" fill="white" opacity="0.85">0..*</text>

<!-- Association: Subscriber --> Channel (has Channel* channel) -->
<path d="M900,540 Q730,530 582,535" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<path d="M583,527 L565,535 L583,543 Z" fill="black" stroke="white" stroke-width="2" stroke-linejoin="round"/>
<text x="740" y="517" font-size="12" text-anchor="middle" fill="white" opacity="0.75">channel : 1</text>

<!-- IChannel (interface) -->
<g>
<path d="M150,60 L580,60 L580,240 L150,240 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M151.5,61.5 L581.5,61 L581,241 L149,240.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="365" y="84" font-size="13" text-anchor="middle" fill="white" opacity="0.75" font-style="italic">&#171;interface&#187;</text>
<text x="365" y="110" font-size="20" text-anchor="middle" fill="white">IChannel</text>
<path d="M162,128 Q365,126 568,129" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="170" y="152" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ subscribe(ISubscriber*) = 0</text>
<text x="170" y="174" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ unsubscribe(ISubscriber*) = 0</text>
<text x="170" y="196" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ notifySubscribers() = 0</text>
<text x="170" y="220" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">role: Subject</text>
</g>

<!-- ISubscriber (interface) -->
<g>
<path d="M900,60 L1300,60 L1300,190 L900,190 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M901.5,61.5 L1301.5,61 L1301,191 L899,190.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="1100" y="84" font-size="13" text-anchor="middle" fill="white" opacity="0.75" font-style="italic">&#171;interface&#187;</text>
<text x="1100" y="110" font-size="20" text-anchor="middle" fill="white">ISubscriber</text>
<path d="M912,128 Q1100,126 1288,129" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="920" y="152" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ update() = 0</text>
<text x="920" y="174" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">role: Observer</text>
</g>

<!-- Channel (concrete Subject) -->
<g>
<path d="M150,460 L580,460 L580,680 L150,680 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M151.5,461.5 L581.5,461 L581,681 L149,680.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="365" y="490" font-size="19" text-anchor="middle" fill="white">Channel</text>
<path d="M162,510 Q365,508 568,511" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="170" y="533" font-size="13" text-anchor="start" fill="white" opacity="0.9">- subscribers : vector&lt;ISubscriber*&gt;</text>
<text x="170" y="553" font-size="13" text-anchor="start" fill="white" opacity="0.9">- name : string</text>
<text x="170" y="573" font-size="13" text-anchor="start" fill="white" opacity="0.9">- latestVideo : string</text>
<text x="170" y="597" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ subscribe(ISubscriber*)</text>
<text x="170" y="617" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ unsubscribe(ISubscriber*)</text>
<text x="170" y="637" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ notifySubscribers()</text>
<text x="170" y="657" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ uploadVideo(title) / getVideoData()</text>
</g>

<!-- Subscriber (concrete Observer) -->
<g>
<path d="M900,460 L1300,460 L1300,620 L900,620 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="1.0"/>
<path d="M901.5,461.5 L1301.5,461 L1301,621 L899,620.5 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
<text x="1100" y="490" font-size="19" text-anchor="middle" fill="white">Subscriber</text>
<path d="M912,510 Q1100,508 1288,511" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
<text x="920" y="533" font-size="13" text-anchor="start" fill="white" opacity="0.9">- name : string</text>
<text x="920" y="553" font-size="13" text-anchor="start" fill="white" opacity="0.9">- channel : Channel*</text>
<text x="920" y="577" font-size="13" text-anchor="start" fill="white" opacity="0.9">+ update()</text>
<text x="920" y="600" font-size="12" text-anchor="start" fill="white" opacity="0.6" font-style="italic">prints channel->getVideoData()</text>
</g>

</svg>
